---
layout: default
---
<article class="wrap narrow page">
  {% unless page.hide_title %}
  <header class="page-head">
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="lede">{{ page.description }}</p>{% endif %}
  </header>
  {% endunless %}
  <div class="prose">
    {{ content }}
  </div>
</article>
