name: Build and deploy site

on:
  push:
    branches: [master]
  schedule:
    - cron: "30 1 * * *" # daily, 07:00 IST — picks up new YouTube videos
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync YouTube videos
        continue-on-error: true
        run: |
          python3 scripts/sync_youtube.py
          if ! git diff --quiet -- _data/videos.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/videos.json
            git commit -m "Update YouTube videos"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
