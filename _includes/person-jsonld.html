{%- assign knows = "" | split: "" -%}
{%- for s in site.data.skills -%}{%- assign knows = knows | concat: s.items -%}{%- endfor -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Ravindra Naik",
  "jobTitle": {{ site.tagline | jsonify }},
  "description": {{ site.description | strip | jsonify }},
  "url": "{{ site.url }}{{ site.baseurl }}/",
  "image": "{{ site.url }}{{ site.baseurl }}/assets/images/ravi.jpeg",
  "email": "mailto:{{ site.author.email }}",
  "address": { "@type": "PostalAddress", "addressLocality": "Bengaluru", "addressCountry": "IN" },
  "worksFor": { "@type": "Organization", "name": "Energy Exemplar", "url": "https://www.energyexemplar.com" },
  "alumniOf": { "@type": "CollegeOrUniversity", "name": "Indian Institute of Technology Guwahati" },
  "knowsAbout": {{ knows | jsonify }},
  "sameAs": {{ site.social.links | jsonify }}
}
</script>
