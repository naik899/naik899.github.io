{% assign v = include.video %}
<figure class="video">
  <button class="player" type="button" data-id="{{ v.id }}" aria-label="Play: {{ v.title | escape }}">
    <img src="https://i.ytimg.com/vi/{{ v.id }}/hqdefault.jpg" alt="" loading="lazy" width="480" height="360">
    <span class="play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
  </button>
  <figcaption>
    <a href="https://www.youtube.com/{% if v.short %}shorts/{{ v.id }}{% else %}watch?v={{ v.id }}{% endif %}" style="color:inherit;text-decoration:none">{{ v.title }}</a>
    <time datetime="{{ v.published }}">{{ v.published | date: '%b %-d, %Y' }}</time>
  </figcaption>
</figure>
