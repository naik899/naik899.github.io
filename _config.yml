title: Ravindra Naik
tagline: Cloud Architect & Gen AI Developer
description: >-
  Cloud Architect and Gen AI Developer with 12+ years of building cloud-native
  platforms, AI agents and developer tooling. Writing and making videos about
  how AI actually works.
url: "https://naik899.github.io"
baseurl: ""
lang: en-US
timezone: Asia/Kolkata

author:
  name: Ravindra Naik
  email: naik899@gmail.com
  location: Bengaluru, India

social:
  name: Ravindra Naik
  links:
    - https://www.linkedin.com/in/naik899/
    - https://github.com/naik899
    - https://www.youtube.com/@thecavemanreports

youtube:
  channel: The Caveman Reports
  url: https://www.youtube.com/@thecavemanreports

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, author: Ravindra Naik }
  - scope: { path: "" }
    values: { image: /assets/images/ravi.jpeg }

collections:
  posts:
    output: true
    permalink: /blog/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
  - .github
